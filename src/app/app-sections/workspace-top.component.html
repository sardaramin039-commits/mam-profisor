<!-- ⚠️ Real-Time Academic Rigor Score Notification Banner -->
<app-academic-rigor-banner
  [chapterContent]="activeChapter()?.content || ''"
  [chapterTitle]="activeChapter()?.title || ''">
</app-academic-rigor-banner>

<!-- Configuration Alerts / Error display -->
@if (errorStr()) {
  <div class="p-3.5 bg-red-50 border border-red-200 text-red-800 text-xs flex items-start gap-2 rounded-xl my-2">
    <mat-icon class="text-red-600 !text-sm !w-4 !h-4 flex-none mt-0.5">error_outline</mat-icon>
    <span>{{ errorStr() }}</span>
  </div>
}

<!-- Local Draft Backup Restoration Banner -->
@if (hasLocalDraft()) {
  <div class="p-4 bg-amber-50/90 border-2 border-amber-500 rounded-xl flex items-center justify-between gap-4 flex-wrap text-right font-serif shadow-xs my-2">
    <div class="flex items-start gap-2.5">
      <mat-icon class="text-amber-700 flex-none mt-0.5">drafts</mat-icon>
      <div class="space-y-1">
        <strong class="text-xs text-amber-950 block">💾 ڕەشنووسێکی کاتیی پاشەکەوتکراو دۆزرایەوە!</strong>
        <p class="text-[11px] text-amber-900">ڕەشنووسێکی ئۆتۆماتیکی لە کاتژمێر <strong>{{ lastAutoSaveTime() }}</strong> پاشەکەوتکراوە. دەتوانیت بیگەڕێنیتەوە تاوەکو کارەکەت لەدەست نەچێت.</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <button type="button" (click)="restoreLocalDraft()" class="px-3 py-1.5 bg-amber-600 hover:bg-amber-700 text-white rounded-lg text-[11px] font-bold transition-all shadow-xs cursor-pointer">
        گەڕاندنەوەی ڕەشنووس
      </button>
      <button type="button" (click)="discardLocalDraft()" class="px-2.5 py-1.5 border border-stone-300 hover:bg-white text-stone-600 rounded-lg text-[10px] font-semibold transition-all cursor-pointer">
        سڕینەوە
      </button>
    </div>
  </div>
}

<!-- System Maintenance Panel (Stability, Cache, Offline & Backup) -->
<div class="my-3">
  <app-system-maintenance-panel></app-system-maintenance-panel>
</div>
