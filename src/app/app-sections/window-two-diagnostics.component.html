@switch (activeSubTab()) {
  @case ('pulse') {
    <app-daily-research-pulse
      [totalWordsInput]="activeChapter()?.wordCount || 0"
      [citationsCountInput]="sources().length"
      [glossaryCountInput]="12">
    </app-daily-research-pulse>
  }
  @case ('health_check') {
    <app-citation-health-check
      [chapterText]="activeChapter()?.content || ''">
    </app-citation-health-check>
  }
  @case ('timeline') {
    <app-chapter-timeline-view
      [chapterId]="activeChapter()?.id || 1"
      [chapterContent]="activeChapter()?.content || ''"
      (restoreRequested)="updateActiveChapterContent($event)">
    </app-chapter-timeline-view>
  }
  @case ('grammar_panel') {
    <app-grammar-syntax-floating-panel
      [chapterContent]="activeChapter()?.content || ''"
      (textUpdated)="updateActiveChapterContent($event)">
    </app-grammar-syntax-floating-panel>
  }
}
