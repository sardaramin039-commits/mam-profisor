<section class="space-y-4">
  <div class="rounded-2xl border border-amber-800 bg-slate-950 p-5">
    <div class="flex items-center gap-3">
      <span class="text-2xl">👑</span>
      <div><h2 class="font-bold text-amber-300">Scholarship Intelligence 55</h2><p class="text-xs text-slate-400">٥٥ پشکنینی نایاب بۆ evidence، methodology، novelty، synthesis و research integrity.</p></div>
    </div>
    <button (click)="run()" [disabled]="loading()" class="mt-4 rounded-xl bg-amber-500 px-4 py-2 text-xs font-bold text-slate-950">{{loading()?'پشکنین...':'پشکنینی هەموو ٥٥ تایبەتمەندی'}}</button>
  </div>
  @if (result(); as r) {
    <div class="grid grid-cols-3 gap-2">
      <div class="rounded-xl border border-emerald-800 bg-emerald-950/30 p-3 text-center"><b>{{r.ready}}</b><div class="text-[10px]">ئامادە</div></div>
      <div class="rounded-xl border border-amber-800 bg-amber-950/30 p-3 text-center"><b>{{r.partial}}</b><div class="text-[10px]">نیوە</div></div>
      <div class="rounded-xl border border-rose-800 bg-rose-950/30 p-3 text-center"><b>{{r.missing}}</b><div class="text-[10px]">کەمە</div></div>
    </div>
  }
  <div class="grid md:grid-cols-2 gap-2">
    @for (f of catalog(); track f.id) {
      <div class="rounded-xl border border-slate-800 bg-slate-900/70 p-3">
        <div class="flex gap-2"><span class="text-[10px] text-amber-400">{{f.id}}</span><b class="text-xs text-slate-200">{{f.name}}</b></div>
        <div class="mt-1 text-[10px] text-slate-500">{{f.category}} · {{f.purpose}}</div>
      </div>
    }
  </div>
</section>
