<div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
        <div class="p-4 bg-slate-900 border border-slate-800 rounded-2xl space-y-3">
          <h3 class="text-xs font-bold text-slate-100 flex items-center gap-1.5">
            <mat-icon class="text-base text-amber-400">fact_check</mat-icon>
            Citation Validator (پشکنینی دروستی سەرچاوەکان)
          </h3>
          <textarea
            #citArea
            rows="4"
            placeholder="لیستی سەرچاوەکان لێرە بنووسە (هەر دێرێک سەرچاوەیەک)..."
            class="w-full bg-slate-950 border border-slate-700 text-slate-100 text-xs rounded-xl p-3 focus:outline-none focus:border-amber-500"
          ></textarea>
          <button
            (click)="validateCitationsInput(citArea.value)"
            [disabled]="multiAgent.isValidatingCitations()"
            class="bg-amber-600 hover:bg-amber-500 text-slate-950 font-bold px-5 py-2.5 rounded-xl text-xs flex items-center gap-2"
          >
            @if (multiAgent.isValidatingCitations()) {
              <mat-icon class="animate-spin text-sm">sync</mat-icon>
              پشکنین...
            } @else {
              <mat-icon class="text-sm">verified</mat-icon>
              پشکنینی دروستی Citation
            }
          </button>

          @if (multiAgent.citationValidationResult(); as cv) {
            <div class="p-3 bg-slate-950 border border-slate-800 rounded-xl space-y-1 text-xs text-slate-300">
              <div class="font-bold text-emerald-400">سەرچاوەی دروست: {{ cv.validCitationsCount }} / {{ cv.totalCitationsChecked }}</div>
            </div>
          }
        </div>

        <div class="p-4 bg-slate-900 border border-slate-800 rounded-2xl space-y-3">
          <h3 class="text-xs font-bold text-slate-100 flex items-center gap-1.5">
            <mat-icon class="text-base text-cyan-400">download_for_offline</mat-icon>
            داگرتن و ئێکسپۆرتی فۆرماتی ئەکادیمی (LaTeX, EPUB, Markdown)
          </h3>
          <input
            #docTitleInput
            type="text"
            placeholder="ناونیشانی فایلی توێژینەوە..."
            class="w-full bg-slate-950 border border-slate-700 text-slate-100 text-xs rounded-xl p-2.5 focus:outline-none focus:border-cyan-500"
          />
          <textarea
            #docContentInput
            rows="3"
            placeholder="دەقی توێژینەوەکەت بۆ داگرتن..."
            class="w-full bg-slate-950 border border-slate-700 text-slate-100 text-xs rounded-xl p-2.5 focus:outline-none focus:border-cyan-500"
          ></textarea>

          <div class="flex flex-wrap gap-2 pt-2">
            <button
              (click)="multiAgent.exportAcademicDocument('latex', docTitleInput.value || 'Paper', docContentInput.value)"
              class="bg-emerald-700 hover:bg-emerald-600 text-white font-bold px-4 py-2 rounded-xl text-xs flex items-center gap-1"
            >
              <mat-icon class="text-sm">code</mat-icon>
              داگرتنی LaTeX (.tex)
            </button>
            <button
              (click)="multiAgent.exportAcademicDocument('markdown', docTitleInput.value || 'Paper', docContentInput.value)"
              class="bg-blue-700 hover:bg-blue-600 text-white font-bold px-4 py-2 rounded-xl text-xs flex items-center gap-1"
            >
              <mat-icon class="text-sm">description</mat-icon>
              داگرتنی Markdown (.md)
            </button>
            <button
              (click)="multiAgent.exportAcademicDocument('epub', docTitleInput.value || 'Paper', docContentInput.value)"
              class="bg-purple-700 hover:bg-purple-600 text-white font-bold px-4 py-2 rounded-xl text-xs flex items-center gap-1"
            >
              <mat-icon class="text-sm">auto_stories</mat-icon>
              داگرتنی EPUB Book
            </button>
          </div>
        </div>
      </div>
