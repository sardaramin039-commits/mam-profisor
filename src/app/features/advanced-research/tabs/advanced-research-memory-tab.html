<div class="space-y-4">
        <div class="p-4 bg-slate-900 border border-slate-800 rounded-2xl space-y-3">
          <div class="flex items-center justify-between">
            <h3 class="text-xs font-bold text-slate-100 flex items-center gap-1.5">
              <mat-icon class="text-base text-cyan-400">psychology</mat-icon>
              بیرگەی بەردەوامی پرۆژە (Research Memory)
            </h3>
            <span class="text-[10px] text-slate-500">خۆکارانە پاشەکەوت دەبێت</span>
          </div>

          <div class="space-y-2">
            <span class="block text-xs text-slate-300">ناوی پرۆژەی تێز یان توێژینەوەکەت:</span>
            <input
              type="text"
              [ngModel]="multiAgent.researchMemory().projectTitle"
              (ngModelChange)="multiAgent.updateProjectTitle($event)"
              class="w-full bg-slate-950 border border-slate-700 text-slate-100 text-xs rounded-xl p-2.5 focus:outline-none focus:border-cyan-500"
            />
          </div>

          <div class="space-y-2 pt-2">
            <span class="block text-xs font-bold text-slate-300">فرەکانی/هیپۆتێزەکان (Hypotheses):</span>
            <div class="flex gap-2">
              <input
                #hypoInput
                type="text"
                placeholder="گریمانەیەکی نوێ بنووسە..."
                (keyup.enter)="multiAgent.addHypothesis(hypoInput.value); hypoInput.value = ''"
                class="flex-1 bg-slate-950 border border-slate-700 text-slate-100 text-xs rounded-xl p-2.5 focus:outline-none focus:border-cyan-500"
              />
              <button
                (click)="multiAgent.addHypothesis(hypoInput.value); hypoInput.value = ''"
                class="bg-cyan-600 hover:bg-cyan-500 text-slate-950 font-bold px-4 rounded-xl text-xs"
              >
                زیادکردن
              </button>
            </div>

            <ul class="space-y-1.5 pt-1">
              @for (hypo of multiAgent.researchMemory().hypotheses; track $index) {
                <li class="flex items-center justify-between p-2 bg-slate-950 border border-slate-800 rounded-xl text-xs text-slate-300">
                  <span>• {{ hypo }}</span>
                  <button (click)="multiAgent.removeHypothesis($index)" class="text-slate-500 hover:text-rose-400">
                    <mat-icon class="text-sm">delete</mat-icon>
                  </button>
                </li>
              }
            </ul>
          </div>
        </div>
      </div>
