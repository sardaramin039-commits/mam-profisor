name: CI Runner Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runner-diagnostic:
    name: Runner, checkout and npm-ci diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Runner preflight
        run: |
          set -euxo pipefail
          echo "Runner: ${RUNNER_NAME}"
          echo "OS: ${RUNNER_OS}"
          echo "Architecture: ${RUNNER_ARCH}"
          node --version
          npm --version
          git --version

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22.22.2
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify configured toolchain
        run: |
          set -euxo pipefail
          node --version
          npm --version
          npm config get cache

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
