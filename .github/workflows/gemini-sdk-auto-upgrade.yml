name: Gemini SDK validation and safe auto-upgrade

on:
  push:
    branches:
      - maintenance/server-build-test-isolation
    paths:
      - 'src/lib/gemini-model-selection.ts'
      - 'src/server/services/gemini-auto-evolution-engine.ts'
      - 'src/server/services/gemini.service.ts'
      - 'src/server/services/google-search-grounding.service.ts'
      - 'src/app/services/gemini-request-manager.service.ts'
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: gemini-sdk-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-latest-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'main' || github.ref_name }}
          fetch-depth: 0

      - name: Setup Node.js and npm cache
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm

      - name: Ensure npm matches packageManager
        run: npm install --global npm@10.9.8 && test "$(npm --version)" = "10.9.8"

      - name: Install locked dependencies
        run: npm ci

      - name: Upgrade SDK in the working tree
        run: npm install @google/genai@latest

      - name: Verify line limits and release prerequisites
        run: |
          npm run line-limit
          npm run release:check

      - name: Lint
        run: npm run lint

      - name: Browser-safe tests
        run: npm test

      - name: Server regression and security tests
        run: npm run test:server

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Production smoke test
        run: npm run release:smoke

      - name: Academic integrity gate
        run: npm run integrity:audit

      - name: Commit verified dependency upgrade to the working feature branch
        if: ${{ github.event_name == 'push' && github.ref_name != 'main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$(git status --porcelain -- package.json package-lock.json)" ]; then
            git config user.name "Gemini SDK Validation Bot"
            git config user.email "actions@github.com"
            git add package.json package-lock.json
            git commit -m "chore(ai): upgrade @google/genai after full validation"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "The locked SDK is already current; no dependency commit is needed."
          fi

      - name: Open a review PR for scheduled or main-branch upgrades
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref_name == 'main') }}
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          branch: automation/google-genai-sdk-latest
          base: main
          delete-branch: true
          title: 'chore(ai): upgrade @google/genai after validation'
          commit-message: 'chore(ai): upgrade @google/genai after validation'
          body: |
            Automated SDK update validated in GitHub Actions before the dependency files were proposed.

            Validation run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            This workflow never merges or deploys automatically.
          add-paths: |
            package.json
            package-lock.json
