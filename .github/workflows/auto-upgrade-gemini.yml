name: Auto-Upgrade Gemini SDK & Features

on:
  schedule:
    # هەموو ڕۆژانی یەکشەممە کاتژمێر ٣ی بەیانی خۆکارانە کار دەکات
    - cron: "0 3 * * 0"
  workflow_dispatch: # ڕێگەت پێدەدات هەر کاتێک خۆشت بتەوێت بە یەک کلیک بیخەیتە کار

jobs:
  auto-upgrade-gemini:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:  
      - name: Checkout Repository  
        uses: actions/checkout@v4  

      - name: Setup Node.js  
        uses: actions/setup-node@v4  
        with:  
          node-version: "20"  

      - name: Upgrade @google/genai to Latest Version  
        run: |  
          npm install @google/genai@latest  

      - name: Verify TypeScript Build  
        run: |  
          npm run build --if-present  

      - name: Commit and Push Updates Automatically  
        run: |  
          git config --global user.name "Gemini Auto-Evolution Bot"  
          git config --global user.email "actions@github.com"  
          git add package.json package-lock.json  
          git diff --staged --quiet || (git commit -m "chore(ai): auto-upgrade @google/genai SDK to latest version" && git push)
