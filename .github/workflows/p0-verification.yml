name: P0 Verification

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      GEMINI_API_KEY: ci-placeholder
      ALLOWED_ORIGINS: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Credential secret audit
        run: npm run security:audit

      - name: TypeScript and Angular build
        run: npm run build

      - name: Unit tests
        run: npm test -- --watch=false

      - name: ESLint
        run: npm run lint
