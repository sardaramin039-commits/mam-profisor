name: CI

on:
  push:
    branches: [main, "fix/**", "ci/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Academic integrity, typecheck and production build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Report npm security advisories (non-blocking)
        shell: bash
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          node scripts/dependency-audit-report.mjs "$RUNNER_TEMP/npm-audit.json"

      - name: Report production dependency advisories (non-blocking)
        shell: bash
        run: |
          npm audit --omit=dev --json > "$RUNNER_TEMP/npm-audit-production.json" || true
          node scripts/dependency-audit-report.mjs "$RUNNER_TEMP/npm-audit-production.json"

      - name: Phase 3 Ironclad Preservation Gate
        env:
          PRESERVATION_EVENT_NAME: ${{ github.event_name }}
          PRESERVATION_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          PRESERVATION_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run phase3:preserve

      - name: Verify release prerequisites and lockfile consistency
        run: npm run release:check

      - name: Check source file line limits
        run: npm run line-limit

      - name: Audit critical academic research client for fabricated results
        run: npm run integrity:audit

      - name: Security and server regression tests
        run: npm run test:server

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build -- --configuration production

      - name: Smoke-check production output
        run: npm run release:smoke
