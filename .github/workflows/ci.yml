name: CI

on:
  push:
    branches: [main, "fix/**", "ci/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Release readiness audit
        run: npm run release:check

      - name: Academic integrity static audit
        run: npm run integrity:audit

      - name: Production build
        run: npm run build -- --configuration production

      - name: Production artifact smoke check
        run: npm run release:smoke
