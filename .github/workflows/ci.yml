name: CI

on:
  push:
    branches: [main, "fix/**", "ci/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Academic integrity, typecheck and production build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify release prerequisites and lockfile consistency
        run: npm run release:check

      - name: Check source file line limits
        run: npm run line-limit

      - name: Audit critical academic research client for fabricated results
        run: npm run integrity:audit

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build -- --configuration production

      - name: Smoke-check production output
        run: npm run release:smoke
