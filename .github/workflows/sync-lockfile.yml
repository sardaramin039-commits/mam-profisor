name: Sync npm Lockfile

on:
  push:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/sync-lockfile.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-lockfile-main
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Configure npm lockfile mode
        run: npm config set package-lock true

      - name: Generate lockfile
        run: npm install --package-lock-only --ignore-scripts --package-lock=true

      - name: Apply non-breaking security updates
        run: npm audit fix --package-lock-only --ignore-scripts || npm audit --omit=dev --audit-level=high

      - name: Verify lockfile exists
        run: test -f package-lock.json

      - name: Commit lockfile when changed
        run: |
          if ! git status --porcelain -- package-lock.json | grep -q .; then
            echo "package-lock.json is already synchronized."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f package-lock.json
          git commit -m "ci: sync npm lockfile"

          git pull --rebase origin main
          git push origin main
