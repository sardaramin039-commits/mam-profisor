name: Mam Professor Quality Gate

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'e2e/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'angular.json'
      - 'tsconfig*.json'
      - '.github/**'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'e2e/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'angular.json'
      - 'tsconfig*.json'
      - '.github/**'
  workflow_dispatch:

concurrency:
  group: mam-profisor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Build, test, lint and runtime smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Source line-limit gate
        run: npm run line-limit

      - name: Release consistency gate
        run: npm run release:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Node route contract tests
        run: npm run test:server

      - name: Academic integrity audit
        run: npm run integrity:audit

      - name: P5 evidence intelligence contract
        run: node scripts/p5-evidence-intelligence-test.mjs

      - name: P6 multi-agent orchestration contract
        run: node scripts/p6-multi-agent-orchestration-test.mjs

      - name: Integrated P7-P10 research chain
        run: node scripts/p7-p10-research-chain-test.mjs

      - name: Integrated P11-P15 publication chain
        run: node scripts/p11-p15-publication-chain-test.mjs

      - name: Integrated P16-P20 submission chain
        run: node scripts/p16-p20-submission-chain-test.mjs

      - name: Digital library factuality audit
        run: node scripts/library-integrity-audit.mjs

      - name: Secret audit
        run: node scripts/security-secret-audit.mjs

      - name: Lint
        run: npm run lint

      - name: Production dependency security audit
        run: npm audit --omit=dev --audit-level=high

      - name: Production build
        run: npm run build

      - name: Install Chromium for browser E2E
        run: npx playwright install --with-deps chromium

      - name: Browser E2E
        run: npm run e2e:ci

      - name: Upload browser E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Production runtime smoke
        run: npm run release:smoke
