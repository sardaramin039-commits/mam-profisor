name: Mam Professor Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: mam-profisor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Build, test, lint and runtime smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Source line-limit gate
        run: npm run line-limit

      - name: Release consistency gate
        run: npm run release:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test -- --watch=false

      - name: Node route contract tests
        run: npm run test:server

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Production runtime smoke
        run: npm run release:smoke

  security:
    name: Production dependency security audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
