name: Quality Gate (Manual)

# The canonical automated pull-request/push workflow is quality.yml.
# Keep this workflow available for manual diagnosis without running duplicate CI.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gate-manual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Unit tests
        run: npm test

      - name: Source file line-limit
        run: npm run line-limit

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Academic integrity audit
        run: npm run integrity:audit

      - name: P5 evidence intelligence contract
        run: node scripts/p5-evidence-intelligence-test.mjs

      - name: P6 multi-agent orchestration contract
        run: node scripts/p6-multi-agent-orchestration-test.mjs

      - name: Integrated P7-P10 research chain
        run: node scripts/p7-p10-research-chain-test.mjs

      - name: Integrated P11-P15 publication chain
        run: node scripts/p11-p15-publication-chain-test.mjs

      - name: Integrated P16-P20 submission chain
        run: node scripts/p16-p20-submission-chain-test.mjs

      - name: Digital library factuality audit
        run: node scripts/library-integrity-audit.mjs

      - name: Secret audit
        run: node scripts/security-secret-audit.mjs

      - name: Runtime dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Production build
        run: npm run build
