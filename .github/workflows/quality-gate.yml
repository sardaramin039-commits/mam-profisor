name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    branches: [main]
  workflow_run:
    workflows: ["Sync npm Lockfile"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Unit tests
        run: npm test

      - name: Source file line-limit
        run: npm run line-limit

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Source file size audit
        run: npm run lint:file-size

      - name: Academic integrity audit
        run: npm run integrity:audit

      - name: Secret audit
        run: node scripts/security-secret-audit.mjs

      - name: Runtime dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Production build
        run: npm run build
