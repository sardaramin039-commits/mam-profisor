name: Dependency refresh preview

on:
  push:
    branches: [chore/security-dependency-refresh-preview]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: dependency-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-candidate:
    name: Generate and validate compatible dependency refresh
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate lockfile for requested version ranges
        run: rm -f package-lock.json && npm install --package-lock-only --ignore-scripts --no-audit

      - name: Apply only non-forced compatible security fixes
        shell: bash
        run: |
          npm audit fix --package-lock-only --ignore-scripts || true

      - name: Clean install candidate lockfile
        run: npm ci

      - name: Report full dependency advisory inventory
        shell: bash
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit-full.json" || true
          node scripts/dependency-audit-report.mjs "$RUNNER_TEMP/npm-audit-full.json"

      - name: Report production-only advisory inventory
        shell: bash
        run: |
          npm audit --omit=dev --json > "$RUNNER_TEMP/npm-audit-production.json" || true
          node scripts/dependency-audit-report.mjs "$RUNNER_TEMP/npm-audit-production.json"

      - name: Verify release prerequisites and lockfile consistency
        run: npm run release:check

      - name: Check source file line limits
        run: npm run line-limit

      - name: Audit academic research client for fabricated verification
        run: npm run integrity:audit

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Production SSR build
        run: npm run build -- --configuration production

      - name: Smoke-check production output
        run: npm run release:smoke

      - name: Upload validated dependency candidate
        uses: actions/upload-artifact@v4
        with:
          name: dependency-refresh-candidate
          path: |
            package.json
            package-lock.json
            ${{ runner.temp }}/npm-audit-full.json
            ${{ runner.temp }}/npm-audit-production.json
          if-no-files-found: error
          retention-days: 7

      - name: Commit validated lockfile back to candidate branch
        if: success() && github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_REF: ${{ github.head_ref }}
        run: |
          cp package-lock.json "$RUNNER_TEMP/candidate-package-lock.json"
          git fetch origin "$PR_HEAD_REF"
          git checkout -B "$PR_HEAD_REF" "origin/$PR_HEAD_REF"
          cp "$RUNNER_TEMP/candidate-package-lock.json" package-lock.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if git diff --cached --quiet -- package-lock.json; then
            echo 'Candidate lockfile matches the branch already.'
          else
            git commit -m 'chore: commit validated dependency lockfile'
            git push origin "HEAD:$PR_HEAD_REF"
          fi
