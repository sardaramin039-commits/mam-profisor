name: Dependency refresh preview

on:
  push:
    branches: [chore/security-dependency-refresh-preview]

permissions:
  contents: read

concurrency:
  group: dependency-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-candidate:
    name: Generate and validate compatible dependency refresh
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate lockfile for requested version ranges
        run: npm install --package-lock-only --ignore-scripts --no-audit

      - name: Apply only non-forced compatible security fixes
        shell: bash
        run: |
          npm audit fix --package-lock-only --ignore-scripts || true

      - name: Clean install candidate lockfile
        run: npm ci

      - name: Report full dependency advisory inventory
        shell: bash
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit-full.json" || true
          node scripts/dependency-audit-report.mjs "$RUNNER_TEMP/npm-audit-full.json"

      - name: Report production-only advisory inventory
        shell: bash
        run: |
          npm audit --omit=dev --json > "$RUNNER_TEMP/npm-audit-production.json" || true
          node scripts/dependency-audit-report.mjs "$RUNNER_TEMP/npm-audit-production.json"

      - name: Verify release prerequisites and lockfile consistency
        run: npm run release:check

      - name: Check source file line limits
        run: npm run line-limit

      - name: Audit academic research client for fabricated verification
        run: npm run integrity:audit

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Production SSR build
        run: npm run build -- --configuration production

      - name: Smoke-check production output
        run: npm run release:smoke

      - name: Upload validated dependency candidate
        uses: actions/upload-artifact@v4
        with:
          name: dependency-refresh-candidate
          path: |
            package.json
            package-lock.json
            ${{ runner.temp }}/npm-audit-full.json
            ${{ runner.temp }}/npm-audit-production.json
          if-no-files-found: error
          retention-days: 7
