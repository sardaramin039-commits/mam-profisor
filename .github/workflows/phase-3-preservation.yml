name: Phase 3 Ironclad Preservation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-3-preservation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preservation:
    name: Ironclad code preservation gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2

      - name: Run Phase 3 preservation gate
        env:
          GITHUB_COMMIT_MESSAGE: ${{ github.event.head_commit.message || github.event.pull_request.title || '' }}
        run: node scripts/phase-3-preservation-gate.mjs
