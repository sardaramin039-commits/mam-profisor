name: Phase 3 Ironclad Preservation

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-3-preservation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preservation:
    name: Ironclad code preservation gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ensure npm matches packageManager
        run: npm install --global npm@10.9.8 && test "$(npm --version)" = "10.9.8"

      - name: Run Phase 3 preservation gate
        env:

          PRESERVATION_EVENT_NAME: ${{ github.event_name }}
          PRESERVATION_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          PRESERVATION_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run phase3:preserve
