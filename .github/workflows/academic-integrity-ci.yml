name: Academic Integrity CI (Manual)

# These checks are part of the canonical automated quality.yml workflow.
# Keep a manual entry point, but do not spend CI minutes on a duplicate PR run.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: academic-integrity-manual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build production
        run: npm run build

      - name: Anti-hallucination audit
        run: npm run integrity:audit

      - name: P5 evidence intelligence contract
        run: node scripts/p5-evidence-intelligence-test.mjs

      - name: P6 multi-agent orchestration contract
        run: node scripts/p6-multi-agent-orchestration-test.mjs

      - name: Integrated P7-P10 research chain
        run: node scripts/p7-p10-research-chain-test.mjs

      - name: Integrated P11-P15 publication chain
        run: node scripts/p11-p15-publication-chain-test.mjs

      - name: Integrated P16-P20 submission chain
        run: node scripts/p16-p20-submission-chain-test.mjs

      - name: File line limits
        run: npm run line-limit

      - name: Lint
        run: npm run lint
